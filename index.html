<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather & Time App</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-gray-900 via-gray-800 to-gray-900 text-white min-h-screen flex items-center justify-center font-sans p-4">

  <div class="app-container w-full max-w-md bg-gray-800/60 backdrop-blur-lg shadow-2xl rounded-2xl p-6 space-y-8 border border-gray-700">
    
    <!-- TIME SECTION -->
    <div class="time-section text-center">
      <h1 id="clock" class="text-5xl md:text-6xl font-bold tracking-widest text-emerald-400 drop-shadow-lg">--:--:--</h1>
      <p id="date" class="text-gray-300 mt-2 text-lg">Loading date...</p>
    </div>

    <hr class="border-gray-700"/>

    <!-- WEATHER SECTION -->
    <div class="weather-section">
      <h2 class="text-center text-2xl font-semibold text-emerald-400 mb-4">Weather Forecast</h2>
      
      <!-- INPUT AREA -->
      <div class="city-input flex flex-col space-y-3">
        <input type="text" id="city-input" placeholder="Enter city name" class="bg-gray-700/60 border border-gray-600 rounded-xl p-3 focus:ring-2 focus:ring-emerald-400 outline-none" required />
        <input type="text" id="state-input" placeholder="Enter state name" class="bg-gray-700/60 border border-gray-600 rounded-xl p-3 focus:ring-2 focus:ring-emerald-400 outline-none" required />
        <input type="text" id="country-input" placeholder="Enter country name" class="bg-gray-700/60 border border-gray-600 rounded-xl p-3 focus:ring-2 focus:ring-emerald-400 outline-none" required />
        <button id="search-btn" class="mt-2 bg-emerald-500 hover:bg-emerald-600 transition-all text-white font-semibold py-3 rounded-xl">Get Weather</button>
      </div>

      <!-- WEATHER CARD -->
      <div id="weather-card" class="weather-card hidden mt-6 bg-gray-700/60 rounded-xl p-5 border border-gray-600 shadow-lg">
        <div class="weather-header flex items-center justify-between mb-4">
          <h3 id="city-name" class="text-xl font-semibold text-emerald-300"></h3>
          <img id="weather-icon" alt="weather icon" class="w-12 h-12" />
        </div>
        <div class="weather-details space-y-1 text-gray-200">
          <p class="text-4xl font-bold"><span id="temp"></span>°C</p>
          <p id="description" class="capitalize text-emerald-400 font-medium"></p>
          <p>Humidity: <span id="humidity"></span>%</p>
          <p>Wind: <span id="wind"></span> m/s</p>
        </div>
      </div>

      <!-- ERROR MESSAGE -->
      <p id="error-message" class="error-message hidden text-red-400 text-center mt-4 font-medium"></p>
    </div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
